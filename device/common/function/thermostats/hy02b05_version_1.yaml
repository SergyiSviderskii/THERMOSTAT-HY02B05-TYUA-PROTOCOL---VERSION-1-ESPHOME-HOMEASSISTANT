binary_sensor: 
  - platform: template 
    id: flag_work_week

  - platform: "tuya"
    id: binary_sensor_heater     
    sensor_datapoint: 102
    on_state:              
      then:  
        - homeassistant.service:
            service: esphome.${esphome_service}_heater_idle
            data_template:
              my_heater_idle: !lambda "return x ? \"true\" : \"false\";"    

  - platform: template
    id: thermostat_connected_heatet
    lambda: |-
      // 1. ЖЕЛЕЗОБЕТОННАЯ ЗАЩИТА: от NAN при старте (включая бинарный датчик)
      if (std::isnan(id(my_climate).target_temperature)) return {};
      if (std::isnan(id(my_climate).current_temperature)) return {};
      if (std::isnan(id(working_hysteresis).state)) return {};
      if (std::isnan(id(binary_sensor_heater).state)) return {};
      if (std::isnan(id(switch_power).state) || !id(switch_power).state) return {};


      // Получаем чистые значения температур
      float target = id(my_climate).target_temperature;
      float current = id(my_climate).current_temperature;
      
      // Проверка шага гистерезиса
      if (id(working_hysteresis).state == 0.5f) {
        target = target + 0.1f;
      }

      // 2. ВАША ЛОГИКА АКТИВАЦИИ (Условия сна генератора):
      // Используем проверенный id(binary_sensor_heater).state
      if (id(binary_sensor_heater).state || (current >= target)) {
        return false; 
      }

      // 3. РАБОТА ТАЙМЕРА (Используем глобальный uint32_t для защиты от зависания через 4.5 часа)
      uint32_t current_time = millis();

      if (current_time - id(last_heartbeat_time) >= 1000) {
        id(last_heartbeat_time) = current_time;

        // Переворачиваем состояние бинарного датчика (генерируем импульс)
        return !id(thermostat_connected_heatet).state;
      }
      
      // Явно удерживаем текущее состояние
      return id(thermostat_connected_heatet).state; 

    on_state:              
      then:  
        - homeassistant.service:
            service: esphome.${esphome_service}_connected 
            data_template:
              my_connected: !lambda "return x ? \"true\" : \"false\";"

