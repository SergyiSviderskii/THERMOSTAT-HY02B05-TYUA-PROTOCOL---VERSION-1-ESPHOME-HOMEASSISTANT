  wifi_bssid_8_: !secret wifi_bssid_8_  
  wifi_bssid_9_: !secret wifi_bssid_9_    
  wifi_bssid_10_: !secret wifi_bssid_10_ 
  wifi_bssid_11_: !secret wifi_bssid_11_ 
  

wifi:
  post_connect_roaming: false
  networks:
  
    - ssid: !secret wifi_ssid_house_hall
      password: !secret wifi_password_iot

    - ssid: !secret wifi_ssid_house_bedroom
      password: !secret wifi_password_iot
  
    - ssid: !secret wifi_ssid_house_bedroom_d
      password: !secret wifi_password_iot
  
    - ssid: !secret wifi_ssid_house_living_room 
      password: !secret wifi_password_iot
 
    - ssid: !secret wifi_ssid_house_canopy 
      password: !secret wifi_password_iot
      
    # - ssid: !secret wifi_ssid_house_garret
    #   password: !secret wifi_password_home      
  
    - ssid: !secret wifi_ssid_house_garage
      password: !secret wifi_password_iot
   
    - ssid: !secret wifi_ssid_bath_garret    
      password: !secret wifi_password_iot
  
    - ssid: !secret wifi_ssid_street_bath_left    
      password: !secret wifi_password_iot
      
    - ssid: !secret wifi_ssid_plus
      password: !secret wifi_password_iot        
      
#   ssid: $wifi_ssid
#   password: $wifi_password_iot
#   fast_connect: true
   

  # Enable fallback hotspot (captive portal) in case wifi connection fails
